name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Windows runners default to core.autocrlf=true. rustfmt requires LF.
          autocrlf: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: fmt
        run: cargo fmt --all -- --check
      - name: test
        run: cargo test --workspace
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: core stays headless
        shell: bash
        run: |
          if grep -E "ratatui|crossterm" crates/game-core/Cargo.toml; then
            echo "game-core must not depend on the terminal"
            exit 1
          fi
