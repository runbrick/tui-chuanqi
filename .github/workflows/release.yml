name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的标签，例如 v0.2.0。标签必须已经存在。"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: build
        run: cargo build --release -p r-chuanqi --bin r-chuanqi --target ${{ matrix.target }}
      - name: pack
        shell: bash
        run: |
          set -euo pipefail
          stage="dist/tui-game"
          rm -rf dist
          mkdir -p "$stage"
          bin="target/${{ matrix.target }}/release/r-chuanqi"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            bin="${bin}.exe"
          fi
          cp "$bin" "$stage/"
          cp -R data "$stage/data"
          name="r-chuanqi-${{ matrix.target }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && tar -a -cf "${name}.zip" tui-game)
          else
            tar -C dist -czf "dist/${name}.tar.gz" tui-game
          fi
      - name: installer
        shell: bash
        env:
          TUI_GAME_PAYLOAD: dist/r-chuanqi-${{ matrix.target }}.${{ matrix.archive == 'zip' && 'zip' || 'tar.gz' }}
        run: |
          set -euo pipefail
          cargo build --release -p r-chuanqi --bin r-chuanqi-setup --target ${{ matrix.target }}
          setup="target/${{ matrix.target }}/release/r-chuanqi-setup"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            setup="${setup}.exe"
            cp "$setup" "dist/r-chuanqi-setup-${{ matrix.target }}.exe"
          else
            chmod +x "$setup"
            cp "$setup" "dist/r-chuanqi-setup-${{ matrix.target }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: r-chuanqi-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > SHA256SUMS
      - name: publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          case "$tag" in
            v*.*.*) ;;
            *)
              echo "标签格式不正确：$tag（需要 vX.Y.Z）"
              exit 1
              ;;
          esac
          notes="下载 r-chuanqi-setup 运行一次。它会装到本机目录，并把 r-chuanqi 加进终端命令。之后在游戏里按 U 更新。存档不会被覆盖。"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --notes "$notes" \
              --verify-tag
          fi
