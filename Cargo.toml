[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.85"
authors = ["tui-game"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
rand = { version = "0.8", features = ["serde1"] }
rand_pcg = { version = "0.3", features = ["serde1"] }
thiserror = "2"
ron = "0.8"
serde_json = "1"
ratatui = "0.29"
crossterm = "0.28"
directories = "5"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
unicode-width = "0.2"
insta = "1"
criterion = "0.5"
proptest = "1"
bincode = "1.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
